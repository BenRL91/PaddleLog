<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback inbox · PaddleLog</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#0c0c10;color:#f4f4f7}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:24px 20px 60px}a{color:#e9c777}h1{margin-bottom:8px}p{line-height:1.5}.muted{color:#b7b7c3}.grid{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px}.panel,.tester{border:1px solid #34343f;border-radius:16px;padding:20px;background:#17171e}.panel{align-self:start}label{display:block;margin:16px 0 8px}input,select,textarea,button{font:inherit;color:inherit;background:#22222c;border:1px solid #50505e;border-radius:10px;padding:12px;min-height:44px}input,select,textarea{width:100%}textarea{min-height:140px;resize:vertical}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button.primary{background:#dc293c;border-color:#dc293c;font-weight:650}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e9c777;outline-offset:3px}.actions,.toolbar,.stats{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.actions{margin-top:20px}.stats{margin:24px 0}.stats span{background:#22222c;border-radius:12px;padding:12px 16px}.toolbar{margin-bottom:16px}.toolbar>div{flex:1;min-width:180px}.toolbar label{margin-top:0}.tester{margin-bottom:12px}.tester h3{margin:0;overflow-wrap:anywhere}.tester p{margin:8px 0}.badge{display:inline-block;background:#30303c;border-radius:20px;padding:5px 10px;font-size:.85rem}.tester header{display:flex;gap:12px;justify-content:space-between;align-items:start}.tester button{flex-shrink:0}#status{min-height:24px}summary{min-height:44px;cursor:pointer;padding:12px 0}.history-row{padding:12px 0;border-bottom:1px solid #34343f;overflow-wrap:anywhere}@media(max-width:720px){.grid{grid-template-columns:1fr}main{padding:20px 16px}.tester header{flex-wrap:wrap}}
textarea{min-height:100px}.report{margin:20px 0;padding:20px;border:1px solid #34343f;border-radius:16px}.report pre{white-space:pre-wrap;overflow-wrap:anywhere}.report h2{font-size:20px}.report{overflow-wrap:anywhere}.report form{max-width:680px;display:grid;gap:12px}.report form p{margin:0}.report>p{white-space:pre-wrap}</style></head><body><main><a href="/admin">← Beta management</a><h1>Feedback inbox</h1><p class="muted">Owner-only reports and catalog corrections. Responses and fix versions below are visible to the reporter.</p><div class="toolbar"><div><label for="reportStatus">Status</label><select id="reportStatus"><option value="all">All</option><option value="open">Open</option><option value="reviewing">Reviewing</option><option value="planned">Planned</option><option value="fixed">Fixed</option><option value="closed">Closed</option></select></div><div><label for="reportSearch">Search this page</label><input id="reportSearch" type="search" placeholder="Message, screen, model or version"></div><button id="refreshReports">Refresh</button></div><p id="inboxStatus" role="status"></p><div id="reports"></div><div class="actions"><button id="previousReports">Previous</button><button id="nextReports">Next</button></div></main><script type="module" src="/admin-feedback.js"></script></body></html>
