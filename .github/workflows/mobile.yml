name: React Native
on:
  pull_request:
    paths: ['mobile/**', 'public/**', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'public/**', '.github/workflows/mobile.yml']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec prettier --check src index.ts app.config.ts metro.config.cjs tests
      - run: pnpm exec expo export --platform ios --platform android
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
